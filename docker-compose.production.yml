services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - collabit_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: docker/server.production.Dockerfile
      target: runtime
    image: collabit-backend:production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    command: ["node", "server/dist/migrate.js", "run"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

  server:
    image: collabit-backend:production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s
    init: true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  collabit_database:
