name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mvp_test
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mvp_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migration integration tests
        run: npm run test:migrations --workspace server
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://mvp_test:migration-test-only@127.0.0.1:5432/postgres

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Isolated API and browser tests
        run: npm run test:stack
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://mvp_test:migration-test-only@127.0.0.1:5432/postgres

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            test-results/
            client/test-results/
            client/playwright-report/
